<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c0fc" />
      <stop offset="100%" stop-color="#339af0" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle for maskable/any -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Cash register illustration inside safe zone -->
  <g transform="translate(86, 86) scale(0.66)" fill="#ffffff">
    <!-- Register base -->
    <path d="M 60 380 L 452 380 L 480 470 L 32 470 Z" fill="#e2e8f0" />
    <rect x="70" y="405" width="372" height="40" rx="8" fill="#cbd5e1" />
    <circle cx="256" cy="425" r="8" fill="#475569" />
    
    <!-- Register body -->
    <rect x="75" y="160" width="362" height="220" rx="16" fill="#ffffff" />
    
    <!-- Display Screen -->
    <rect x="110" y="190" width="292" height="70" rx="10" fill="#0f172a" />
    <!-- Screen text (ARS symbol and amount) -->
    <text x="135" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#4ade80">$ 1.250</text>
    <circle cx="370" cy="225" r="7" fill="#22c55e" />
    
    <!-- Keypad buttons -->
    <g fill="#94a3b8">
      <rect x="110" y="280" width="55" height="35" rx="6" />
      <rect x="180" y="280" width="55" height="35" rx="6" />
      <rect x="250" y="280" width="55" height="35" rx="6" />
      <rect x="320" y="280" width="82" height="35" rx="6" fill="#22c55e" />
      
      <rect x="110" y="325" width="55" height="35" rx="6" />
      <rect x="180" y="325" width="55" height="35" rx="6" />
      <rect x="250" y="325" width="55" height="35" rx="6" />
      <rect x="320" y="325" width="82" height="35" rx="6" fill="#3b82f6" />
    </g>

    <!-- Barcode scanner / receipt top slot -->
    <rect x="170" y="80" width="172" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
    <!-- Receipt paper lines -->
    <line x1="190" y1="105" x2="320" y2="105" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="190" y1="125" x2="280" y2="125" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="190" y1="145" x2="310" y2="145" stroke="#16a34a" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <!-- Subtle brand banner at bottom inside safe zone -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="3">PUMPA CAJA</text>
</svg>
